*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 75% -15%,#174a5b 0,transparent 42%),linear-gradient(140deg,#07131d,#0b1e2c 65%,#091421);color:var(--text);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--amber);outline-offset:3px}a{color:var(--blue)}.shell{max-width:1100px;margin:auto;padding:24px 20px 70px}.header{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px;flex-wrap:wrap}.brand{font-weight:900;letter-spacing:.12em;font-size:1.12rem}.brand b{color:var(--teal)}.topactions{display:flex;gap:8px;flex-wrap:wrap}.chip{display:inline-block;border:1px solid #5b7a8a;border-radius:100px;padding:5px 12px;color:var(--muted);font-size:.8rem;letter-spacing:.04em}.redchip{color:#ffd4dc;border-color:#97556b;background:#60253755}.btn{border:1px solid #547687;background:linear-gradient(180deg,#1e4558,#143044);color:var(--text);padding:11px 17px;border-radius:11px;font-weight:750;transition:transform .12s,border-color .12s}.btn:hover:not(:disabled){transform:translateY(-2px);border-color:var(--teal)}.btn-primary{background:linear-gradient(130deg,#2be7bf,#7decca);color:#062724;border-color:#a2f8df}.btn-ghost{background:transparent}.btn-danger{color:#ffd5d9;border-color:#9c5967}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:stretch}.panel{background:linear-gradient(145deg,#153242ee,#0d2232ef);border:1px solid var(--line);border-radius:22px;padding:27px;box-shadow:var(--shadow)}.eyebrow{color:var(--teal);font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;font-weight:800}.hero h1{font-size:clamp(2.2rem,5vw,4.8rem);line-height:1.04;letter-spacing:-.055em;margin:13px 0 18px}.hero h1 span{color:var(--teal)}p{margin:0 0 14px}h2{line-height:1.22;margin:0 0 13px}h3{margin:0 0 10px}.muted{color:var(--muted)}.small{font-size:.9rem}.stack{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.mission{background:#081a26a6;border:1px solid #345a69;border-radius:14px;padding:16px;margin:18px 0}.mission strong{color:var(--teal)}.scene{position:relative;min-height:360px;border:1px solid #31566a;border-radius:19px;overflow:hidden;background:radial-gradient(ellipse at 52% 68%,#285466 0,#0c2638 58%,#06121e 100%)}.scene:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0,transparent 6px,#fff1 7px);opacity:.25}.scene-floor{position:absolute;inset:auto -25% -30% -25%;height:55%;background:linear-gradient(0deg,#06121b,#234151);transform:perspective(250px) rotateX(47deg)}.scene-door{position:absolute;right:9%;bottom:19%;width:27%;height:64%;border:8px solid #45687a;border-bottom:0;border-radius:12px 12px 0 0;background:linear-gradient(90deg,#1a3648,#0b1924 70%);box-shadow:0 0 0 2px #162e3a,0 0 30px #64eecb22}.scene-door:before{content:"⛔";position:absolute;top:32%;left:32%;font-size:35px;filter:drop-shadow(0 0 10px #ff8686)}.scene-screen{position:absolute;top:13%;left:9%;width:49%;height:34%;background:#041d2a;border:9px solid #284e60;border-radius:12px;box-shadow:0 0 20px #33ebce22;display:flex;align-items:center;justify-content:center;color:#60f1d0;font-size:clamp(1.5rem,4vw,3.1rem);font-weight:900;letter-spacing:.12em}.scene-screen:after{content:"⌁  ⌁⌁  ⌁  ⌁⌁";font-size:1.1rem;position:absolute;bottom:12%;left:10%;color:#7de5f3}.scene-bed{position:absolute;bottom:23%;left:9%;height:12%;width:47%;background:#577a8d;border-radius:12px 20px 6px 6px;box-shadow:0 8px 0 #1b3849}.scene-bed:before{content:"";position:absolute;top:-30%;left:8%;width:23%;height:44%;background:#dae4eb;border-radius:9px}.scene-caption{position:absolute;left:18px;bottom:15px;color:#a5e6e1;font-size:.78rem;letter-spacing:.1em}.section{margin-top:26px}.rooms{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:11px}.room{min-width:0;text-align:left;border:1px solid #3a5a6d;background:#102737;border-radius:15px;padding:16px 13px;color:var(--text)}.room[aria-current="step"]{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal)}.room.locked{opacity:.56}.room .symbol{font-size:1.7rem;display:block;margin-bottom:10px}.room strong{font-size:.9rem;display:block;line-height:1.25}.room small{color:var(--muted);display:block;margin-top:6px}.rule-list{padding-left:23px}.rule-list li{margin:8px 0}.question-top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}.progress{height:11px;border-radius:20px;background:#07151f;border:1px solid #436174;overflow:hidden;margin:15px 0 22px}.progress>div{height:100%;width:0;background:linear-gradient(90deg,#43cab5,#8cf6b3);transition:width .3s}.question{font-size:clamp(1.18rem,2.5vw,1.55rem);font-weight:750;line-height:1.4;margin:17px 0 20px}.options{display:grid;gap:10px}.option{display:flex;gap:12px;align-items:flex-start;border:1px solid #395b70;background:#0d2332;border-radius:12px;padding:13px 15px;cursor:pointer}.option:has(input:checked){background:#164b51;border-color:var(--teal)}.option input{margin-top:5px;accent-color:#5aefcc;flex:none}.answerfield{background:#081a27;border:1px solid #5c8093;border-radius:10px;color:var(--text);padding:12px;width:100%;max-width:260px}.matchgrid{display:grid;grid-template-columns:minmax(120px,1fr) minmax(150px,1.15fr);gap:9px;align-items:center}.matchgrid select{min-width:0;width:100%;border:1px solid #54778a;border-radius:9px;background:#081e2c;color:#edf9fa;padding:11px}.matchterm{font-weight:700;padding:11px;border:1px solid #375366;border-radius:9px}.feedback{border:1px solid #4c7982;background:#0d343e;border-radius:13px;padding:16px 18px;margin-top:18px}.feedback.good{border-color:#4baf88;background:#0d342d}.feedback.bad{border-color:#ba6e7b;background:#3b2430}.feedback strong{display:block;margin-bottom:8px}.feedback p:last-child{margin-bottom:0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:19px}.countbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.countpill{border:1px solid #406475;padding:5px 10px;border-radius:50px;font-size:.85rem}.score{color:var(--teal);font-weight:800}.foot{border-top:1px solid #315062;margin-top:30px;padding-top:20px;color:var(--muted);font-size:.87rem}.hidden{display:none!important}.notice{border-left:3px solid var(--amber);padding:10px 15px;background:#533d182f;color:#ffddb3;border-radius:0 9px 9px 0}.certificate{background:linear-gradient(145deg,#125354,#172b4c);border:1px solid #80e9c4;border-radius:20px;text-align:center;padding:35px 20px}.certificate .seal{font-size:4rem}.summarylist{display:grid;gap:10px;margin-top:15px}.summaryitem{border:1px solid #375a6d;border-radius:12px;padding:15px;background:#0a2231}.summaryitem p{margin:8px 0}.summaryitem details{margin-top:9px}.summaryitem summary{cursor:pointer;color:var(--teal);font-weight:700}@media(max-width:750px){.hero{grid-template-columns:1fr}.rooms{grid-template-columns:repeat(2,minmax(0,1fr))}.panel{padding:19px}.scene{min-height:280px}.question{font-size:1.23rem}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}@media print{body{background:white;color:black}.header,.actions,.rooms,.scene,.btn{display:none!important}.panel,.summaryitem{color:black;background:white;box-shadow:none}.muted{color:#444}}

<body><div class="shell"><header class="header"><div class="brand">✚ <b>CODE BLUE</b> <span class="chip">BHS405</span></div><div class="topactions"><button class="btn btn-ghost" id="homeBtn" type="button">⌂ Home</button><button class="btn btn-ghost" id="rulesBtn" type="button">ⓘ Rules</button><button class="btn btn-ghost" id="resetBtn" type="button">↺ Reset progress</button></div></header><main id="app" tabindex="-1"></main><footer class="foot">BHS405 Anatomy & Physiology · Educational practice only. Not a clinical decision-making tool. Free, self-contained HTML game; no account required to play. Progress is saved only in this browser.</footer></div>
<script>
'use strict';
const R=[
 {name:'Emergency Ward',icon:'🫀',topic:'Cardiovascular anatomy and physiology',story:'A telemetry alarm has activated. Restore the cardiovascular monitoring system to release Door 1.',codeLabel:'CARDIAC ACCESS',questions:[
  {t:'mcq',q:'Which structure normally initiates the electrical impulse that sets the resting heart rhythm?',o:['Atrioventricular node','Sinoatrial node','Bundle branches','Purkinje fibres'],a:1,e:'The sinoatrial (SA) node is the primary pacemaker because its cells normally depolarize more rapidly than other pacemaker tissues.'},
  {t:'mcq',q:'During ventricular systole, which valves normally prevent blood from flowing back into the atria?',o:['Aortic and pulmonary valves','Mitral and tricuspid valves','Pulmonary and mitral valves','Aortic and tricuspid valves'],a:1,e:'The atrioventricular valves (mitral and tricuspid) close during ventricular systole, preventing regurgitation into the atria.'},
  {t:'mcq',q:'A patient loses a large volume of blood. What is the immediate effect of reduced venous return on stroke volume, assuming other factors remain initially unchanged?',o:['Stroke volume increases','Stroke volume remains identical','Stroke volume decreases','Stroke volume becomes independent of preload'],a:2,e:'Reduced venous return lowers ventricular preload, which generally reduces stroke volume through the Frank–Starling mechanism.'},
  {t:'mcq',q:'Which vessels are the main site of peripheral vascular resistance?',o:['Large veins','Arterioles','Venae cavae','Pulmonary veins'],a:1,e:'Arterioles have muscular walls that change lumen diameter and thus provide most of the adjustable systemic vascular resistance.'},
  {t:'mcq',q:'In a normal cardiac cycle, which event produces the first heart sound (S1)?',o:['Closure of semilunar valves','Opening of AV valves','Closure of AV valves','Atrial depolarization'],a:2,e:'S1 mainly reflects closure of the mitral and tricuspid valves at the onset of ventricular systole.'},
  {t:'tf',q:'The pulmonary arteries normally carry deoxygenated blood from the right ventricle toward the lungs.',a:true,e:'True. Pulmonary arteries are defined by carrying blood away from the heart; unlike systemic arteries, they normally carry deoxygenated blood.'},
  {t:'match',q:'Match each cardiovascular structure with its primary function.',left:['SA node','Aortic valve','Capillaries'],right:['Primary pacemaker','Prevents backflow from aorta to left ventricle','Main site of exchange with tissues'],a:[0,1,2],e:'The SA node initiates rhythm, the aortic valve blocks aortic backflow, and capillaries enable diffusion and exchange.'},
  {t:'code',q:'Security keypad: a patient has blood pressure 120/60 mmHg. Estimate mean arterial pressure (MAP) using DBP + ⅓(SBP − DBP). Enter the rounded MAP in mmHg.',a:'80',hint:'60 + (120 − 60) ÷ 3',e:'MAP ≈ 60 + (120 − 60)/3 = 80 mmHg. This is a standard approximation at typical heart rates.'}
 ]},
 {name:'Respiratory ICU',icon:'🫁',topic:'Respiratory anatomy and gas exchange',story:'The ICU ventilation console has gone into lockdown. Solve the respiratory puzzles to open Door 2.',codeLabel:'VENTILATION ACCESS',questions:[
  {t:'mcq',q:'Where does most oxygen and carbon dioxide diffusion between air and blood occur?',o:['Trachea','Terminal bronchioles','Alveolar-capillary membrane','Pleural cavity'],a:2,e:'The thin alveolar-capillary membrane creates a large surface area and short diffusion distance for gas exchange.'},
  {t:'mcq',q:'Which action normally occurs when the diaphragm contracts during quiet inspiration?',o:['Thoracic volume decreases','Intrathoracic pressure increases above atmospheric','Thoracic volume increases','Air flows out of the lungs'],a:2,e:'Diaphragm contraction increases thoracic volume, reduces alveolar pressure below atmospheric pressure, and draws air inward.'},
  {t:'mcq',q:'In an otherwise healthy person at sea level, what is the major chemical driver of minute-to-minute ventilation?',o:['Small fluctuations in blood glucose','Changes in PaCO₂ via central chemoreceptors','Changes in serum sodium','Changes in hemoglobin concentration alone'],a:1,e:'Central chemoreceptors respond primarily to cerebrospinal fluid pH changes caused by arterial CO₂, strongly influencing ventilation.'},
  {t:'mcq',q:'Which change shifts the oxyhemoglobin dissociation curve to the right and promotes oxygen unloading in tissues?',o:['Decreased temperature','Decreased PCO₂','Increased pH','Increased PCO₂'],a:3,e:'Increased CO₂ and H⁺ (lower pH), as well as higher temperature, shift the curve right and facilitate oxygen release.'},
  {t:'mcq',q:'A segment of lung is ventilated but receives almost no perfusion. Physiologically, this region approaches which condition?',o:['Anatomic shunt','Alveolar dead space','Normal ventilation–perfusion matching','Reduced anatomic dead space'],a:1,e:'Ventilation without effective perfusion is alveolar dead space; air reaches alveoli but little blood is available for gas exchange.'},
  {t:'tf',q:'Surfactant reduces alveolar surface tension and helps prevent alveolar collapse.',a:true,e:'True. Pulmonary surfactant from type II pneumocytes lowers surface tension, improving compliance and alveolar stability.'},
  {t:'match',q:'Match each respiratory structure with its role.',left:['Epiglottis','Type II pneumocyte','Diaphragm'],right:['Helps protect airway during swallowing','Produces pulmonary surfactant','Primary muscle of quiet inspiration'],a:[0,1,2],e:'The epiglottis assists airway protection, type II cells produce surfactant, and the diaphragm drives quiet inspiration.'},
  {t:'code',q:'Ventilator console: respiratory rate is 12 breaths/min and tidal volume is 500 mL. Calculate minute ventilation in mL/min. Enter the number.',a:'6000',hint:'Respiratory rate × tidal volume',e:'Minute ventilation = 12 × 500 = 6000 mL/min (6 L/min). This is total ventilation, not alveolar ventilation.'}
 ]},
 {name:'Neurology Lab',icon:'🧠',topic:'Nervous system and neural signaling',story:'A neurological assessment file is encrypted. Restore the neural network terminals and release Door 3.',codeLabel:'NEURAL ACCESS',questions:[
  {t:'mcq',q:'During the rising phase of a typical neuronal action potential, what causes rapid membrane depolarization?',o:['Voltage-gated K⁺ channels opening','Voltage-gated Na⁺ channels opening','Na⁺/K⁺ ATPase suddenly stopping','Cl⁻ influx through ligand-gated channels'],a:1,e:'Voltage-gated sodium channels open rapidly, allowing Na⁺ influx and causing the upstroke of the action potential.'},
  {t:'mcq',q:'Which part of the brainstem is especially important for basic respiratory rhythm generation?',o:['Medulla oblongata','Cerebellar cortex','Occipital lobe','Basal ganglia'],a:0,e:'Respiratory pattern-generating circuits are primarily located in the medulla, with modulation from pontine centers.'},
  {t:'mcq',q:'A lesion damages the dorsal root of a spinal nerve. Which function is most directly affected?',o:['Motor output from ventral horn only','Sensory input entering the spinal cord','Cerebrospinal fluid production','Cranial nerve function only'],a:1,e:'The dorsal root carries sensory afferent axons into the spinal cord; ventral roots carry motor efferents out.'},
  {t:'mcq',q:'Which neurotransmitter is released at the normal skeletal neuromuscular junction?',o:['Dopamine','Acetylcholine','Serotonin','Norepinephrine'],a:1,e:'Somatic motor neurons release acetylcholine onto nicotinic receptors on skeletal muscle end plates.'},
  {t:'mcq',q:'An adult develops a left-sided motor cortex injury above the pyramidal decussation. Which pattern of weakness is most likely?',o:['Left-sided weakness only','Right-sided weakness','No motor effects','Bilateral facial paralysis only'],a:1,e:'Most corticospinal fibers cross in the lower medulla, so lesions above the crossing often cause contralateral limb weakness.'},
  {t:'tf',q:'Myelin normally increases action-potential conduction speed by enabling saltatory conduction between nodes of Ranvier.',a:true,e:'True. Myelin insulates axons, and action potentials are regenerated at nodes of Ranvier for faster conduction.'},
  {t:'match',q:'Match each nervous-system structure with its function.',left:['Cerebellum','Hypothalamus','Dorsal root ganglion'],right:['Coordinates movement and balance','Integrates many homeostatic responses','Contains cell bodies of primary sensory neurons'],a:[0,1,2],e:'The cerebellum coordinates motor activity, the hypothalamus regulates homeostasis, and dorsal root ganglia house sensory neuron cell bodies.'},
  {t:'code',q:'Neuro assessment lock: a patient opens eyes to speech (E3), speaks confused sentences (V4), and localizes pain (M5). Enter the total Glasgow Coma Scale score.',a:'12',hint:'Add the eye, verbal and motor component scores.',e:'GCS = E3 + V4 + M5 = 12/15. Record individual components as well as the total in practice.'}
 ]},
 {name:'Renal Unit',icon:'💧',topic:'Renal physiology and fluid homeostasis',story:'The dialysis control system is secured. Investigate fluid balance to unlock Door 4.',codeLabel:'RENAL ACCESS',questions:[
  {t:'mcq',q:'Which nephron structure initially filters plasma to form glomerular filtrate?',o:['Collecting duct','Glomerular capillary–Bowman’s capsule interface','Distal convoluted tubule','Loop of Henle'],a:1,e:'Ultrafiltration occurs across the glomerular filtration barrier into Bowman’s space.'},
  {t:'mcq',q:'Which hormone most directly increases water permeability in the renal collecting ducts?',o:['Insulin','Antidiuretic hormone (vasopressin)','Calcitonin','Thyroxine'],a:1,e:'ADH binds V2 receptors, stimulating aquaporin-2 insertion and increasing water reabsorption in collecting ducts.'},
  {t:'mcq',q:'A fall in renal perfusion stimulates renin release. Which substance is subsequently formed by angiotensin-converting enzyme (ACE)?',o:['Angiotensin I from angiotensin II','Angiotensin II from angiotensin I','Aldosterone from renin','ADH from aldosterone'],a:1,e:'ACE converts angiotensin I to angiotensin II, which promotes vasoconstriction and aldosterone release.'},
  {t:'mcq',q:'Where is the largest fraction of filtered sodium normally reabsorbed?',o:['Proximal convoluted tubule','Thin descending limb alone','Collecting duct alone','Renal pelvis'],a:0,e:'About two-thirds of filtered sodium is typically reabsorbed in the proximal tubule, along with much of the filtered water.'},
  {t:'mcq',q:'In metabolic acidosis, which renal adaptation helps restore acid–base balance over time?',o:['Decreased H⁺ excretion','Increased bicarbonate loss in urine','Increased H⁺ excretion and generation of new bicarbonate','Complete shutdown of ammonium excretion'],a:2,e:'The kidneys increase net acid excretion, including ammonium and titratable acids, and replenish plasma bicarbonate.'},
  {t:'tf',q:'Aldosterone generally increases sodium reabsorption and potassium secretion in the distal nephron.',a:true,e:'True. Aldosterone enhances sodium uptake and promotes potassium secretion, especially in principal cells of the distal nephron.'},
  {t:'match',q:'Match the renal structure or hormone with its key role.',left:['Loop of Henle','ADH','Renin'],right:['Helps generate medullary osmotic gradient','Increases collecting-duct water reabsorption','Initiates the renin–angiotensin–aldosterone cascade'],a:[0,1,2],e:'Countercurrent mechanisms involve the loop of Henle; ADH conserves water; renin initiates the RAAS cascade.'},
  {t:'code',q:'Fluid-balance safe: urine output is 240 mL over 4 hours. Calculate the average urine output in mL/hour. Enter the number.',a:'60',hint:'Total urine volume ÷ observation time',e:'240 mL ÷ 4 h = 60 mL/h. Clinical interpretation also requires patient weight and context.'}
 ]},
 {name:'Final Escape',icon:'🔓',topic:'Integrated clinical physiology',story:'One final door separates you from freedom. Integrate physiology across organ systems to release the hospital exit.',codeLabel:'FINAL EXIT ACCESS',questions:[
  {t:'mcq',q:'A patient stands quickly and briefly experiences a fall in arterial pressure. Which immediate reflex response helps restore pressure?',o:['Reduced sympathetic outflow and bradycardia','Increased baroreceptor firing','Increased sympathetic outflow and heart rate','Complete cessation of venous return'],a:2,e:'Lower arterial stretch decreases baroreceptor firing, increasing sympathetic activity and often heart rate and vascular tone.'},
  {t:'mcq',q:'A patient is hypoventilating and retaining CO₂. Which primary acid–base disturbance is expected initially?',o:['Respiratory alkalosis','Respiratory acidosis','Metabolic alkalosis','Metabolic acidosis caused by bicarbonate loss'],a:1,e:'CO₂ retention raises carbonic acid and hydrogen ion concentration, causing primary respiratory acidosis.'},
  {t:'mcq',q:'Following dehydration, which combined response best conserves circulating fluid volume?',o:['Reduced ADH and reduced thirst','Increased ADH and activation of RAAS','Increased urine dilution and natriuresis only','Suppressed aldosterone secretion'],a:1,e:'ADH increases water retention, while RAAS supports sodium retention and blood pressure during volume depletion.'},
  {t:'mcq',q:'A patient has a severely reduced hemoglobin concentration but a normal arterial oxygen saturation. Which oxygen-transport variable is most directly reduced?',o:['Oxygen content of arterial blood','Alveolar ventilation necessarily','Oxygen saturation by definition','Partial pressure of inspired oxygen'],a:0,e:'Arterial oxygen content depends heavily on hemoglobin concentration; saturation may be normal despite reduced oxygen-carrying capacity.'},
  {t:'mcq',q:'During moderate exercise, which physiological adjustment helps increase oxygen delivery to skeletal muscle?',o:['Decreased cardiac output','Reduced local muscle blood flow','Increased cardiac output and local vasodilation','Complete closure of systemic arterioles'],a:2,e:'Exercise increases cardiac output and redistributes blood toward working muscles through local metabolic vasodilation.'},
  {t:'tf',q:'A normal arterial oxygen saturation always guarantees adequate oxygen delivery to tissues.',a:false,e:'False. Tissue oxygen delivery also depends on hemoglobin, cardiac output and perfusion; saturation alone is insufficient.'},
  {t:'match',q:'Match each finding with the most relevant physiological concept.',left:['Raised arterial CO₂','Low circulating blood volume','Low hemoglobin with normal SpO₂'],right:['Respiratory acid load','Reduced preload and activation of volume-preserving responses','Reduced arterial oxygen content'],a:[0,1,2],e:'Hypercapnia increases acid load; hypovolemia reduces preload and activates compensation; anemia reduces oxygen content even with normal SpO₂.'},
  {t:'code',q:'Final exit keypad: heart rate is 70 beats/min and stroke volume is 70 mL/beat. Calculate cardiac output in mL/min. Enter the number.',a:'4900',hint:'Heart rate × stroke volume',e:'Cardiac output = 70 × 70 = 4900 mL/min (4.9 L/min). Cardiac output is one determinant of systemic oxygen delivery.'}
 ]}
];
const STORE='bhs405-codeblue-v1';const total=R.reduce((n,r)=>n+r.questions.length,0);const defaultState=()=>({room:0,steps:R.map(()=>0),done:R.map(()=>false),correct:0,attempts:0,started:false,finished:false});
let state;try{state={...defaultState(),...JSON.parse(localStorage.getItem(STORE)||'{}')}}catch{state=defaultState()}if(!Array.isArray(state.steps)||state.steps.length!==5||!Array.isArray(state.done)||state.done.length!==5)state=defaultState();
let hadWrong=false,mode='home';
const $=id=>document.getElementById(id);const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch{}}
function completed(){return state.steps.reduce((n,s)=>n+s,0)}
function visitedRoom(index){return index===0||state.done[index-1]}
function renderRoomMap(){return `<section class="section" aria-label="Room map"><div class="eyebrow">Hospital floor map</div><div class="rooms">${R.map((r,i)=>`<button class="room ${visitedRoom(i)?'':'locked'}" ${visitedRoom(i)?'':'disabled'} type="button" data-room="${i}" ${i===state.room?'aria-current="step"':''}><span class="symbol">${state.done[i]?'✅':visitedRoom(i)?r.icon:'🔒'}</span><strong>${i+1}. ${escapeHTML(r.name)}</strong><small>${state.done[i]?'Cleared · 8/8':visitedRoom(i)?state.steps[i]+'/8 complete':'Locked'}</small></button>`).join('')}</div></section>`}
function scrollMain(){setTimeout(()=>{window.scrollTo({top:0,behavior:'smooth'});$('app').focus({preventScroll:true})},0)}
function render(){let html='';if(mode==='rules'){html=rules();}else if(mode==='home'){html=home();}else if(mode==='question'){html=questionScreen();}else if(mode==='door'){html=doorScreen();}else if(mode==='finish'){html=finishScreen();}else if(mode==='review'){html=reviewScreen();} $('app').innerHTML=html;wire();}
function home(){return `<div class="hero"><div class="panel"><div class="eyebrow">Hospital lockdown protocol · nursing education</div><h1>CODE <span>BLUE</span><br>Escape the Hospital</h1><p class="muted">The hospital has locked down. You are a student nurse. Solve 40 Anatomy & Physiology challenges in five rooms to restore the systems and unlock the final exit.</p><div class="stack"><span class="chip">5 rooms</span><span class="chip">40 questions</span><span class="chip">No compulsory timer</span><span class="chip">No login</span></div><div class="mission"><strong>MISSION:</strong> Explain the physiology, decode the clues and unlock all five security doors.</div><div class="actions"><button class="btn btn-primary" data-action="start">${state.started?'▶ Continue mission':'▶ Start mission'}</button><button class="btn" data-action="rules">Read game rules</button></div></div><div class="scene" role="img" aria-label="Illustrated hospital escape room: a monitor displays CODE BLUE beside a locked security door"><div class="scene-floor"></div><div class="scene-screen">CODE BLUE</div><div class="scene-bed"></div><div class="scene-door"></div><div class="scene-caption">WARD 05 · SECURITY LOCKDOWN</div></div></div>${renderRoomMap()}<section class="section panel"><h2>Learning outcomes</h2><p>By the end of the game, learners should be able to identify key structures and functions of cardiovascular, respiratory, nervous and renal systems; explain relevant homeostatic mechanisms; apply physiological formulas; interpret simple clinical data; and integrate physiological concepts in patient scenarios.</p><p class="muted small">Topics are proposed for BHS405; verify alignment with your lecturer’s actual syllabus. Medical content is educational and should not replace local clinical guidelines.</p></section>`}
function rules(){return `<section class="panel"><div class="eyebrow">Mission briefing</div><h1>How to play</h1><ol class="rule-list"><li>Start in the Emergency Ward, then progress through five hospital rooms.</li><li>Each room contains <strong>8 questions</strong>: 5 MCQs, 1 True/False, 1 matching activity and 1 numeric clinical-code puzzle.</li><li>Answer each challenge to reveal an explanation. Correct answers earn <strong>10 points</strong>. Incorrect first attempts earn 0 points for that question, but you may retry after reading the hint.</li><li>All eight challenges must be solved correctly to unlock the room’s security door.</li><li>Use the Room Map to revisit an unlocked room. Current progress is automatically saved on the same browser/device; clearing browser data may erase it.</li><li>No countdown, payment, player account, or internet connection after loading the HTML file is necessary.</li><li>After clearing the fifth room, see your mission result and review the question bank.</li></ol><p class="notice">Accessibility: Play using a mouse, touchscreen or keyboard (Tab, Space and Enter). Matching uses dropdowns rather than drag-and-drop. Sound effects are intentionally omitted for quiet, inclusive use.</p><div class="actions"><button class="btn btn-primary" data-action="start">${state.started?'Continue mission':'Begin mission'}</button><button class="btn" data-action="home">Back to home</button></div></section>`}
function roomIntro(r,index){return `<div class="eyebrow">Room ${index+1} / 5 · ${escapeHTML(r.topic)}</div><h2>${r.icon} ${escapeHTML(r.name)}</h2><p class="muted">${escapeHTML(r.story)}</p>`}
function typeLabel(t){return ({mcq:'Multiple choice',tf:'True / False',match:'Matching puzzle',code:'Clinical access code'})[t]}
function questionScreen(){const i=state.room,j=state.steps[i],r=R[i];if(j>=8){mode='door';return doorScreen()}const q=r.questions[j];let html=`<section class="panel">${roomIntro(r,i)}<div class="question-top"><span class="chip redchip">🔒 ${escapeHTML(r.codeLabel)}</span><span class="score">Score: ${state.correct*10} / 400</span></div><div class="progress" role="progressbar" aria-label="Overall question progress" aria-valuemin="0" aria-valuemax="40" aria-valuenow="${completed()}"><div style="width:${completed()/total*100}%"></div></div><div class="question-top"><span class="eyebrow">Challenge ${j+1} of 8 · ${typeLabel(q.t)}</span><span class="muted small">${completed()} / 40 completed</span></div><div class="question" id="questionText">${escapeHTML(q.q)}</div>`;
 if(q.t==='mcq'||q.t==='tf'){const options=q.t==='mcq'?q.o:['True','False'];html+=`<fieldset style="border:0;margin:0;padding:0" aria-labelledby="questionText"><div class="options">${options.map((o,k)=>`<label class="option"><input type="radio" name="ans" value="${k}"><span><b>${q.t==='mcq'?String.fromCharCode(65+k)+'. ':''}</b>${escapeHTML(o)}</span></label>`).join('')}</div></fieldset>`}
 if(q.t==='match'){html+=`<p class="muted small">Choose the matching function for each term. Each function is used once.</p><div class="matchgrid">${q.left.map((s,k)=>`<div class="matchterm">${escapeHTML(s)}</div><select aria-label="Match for ${escapeHTML(s)}" data-match="${k}"><option value="">Choose a function...</option>${q.right.map((right,n)=>`<option value="${n}">${escapeHTML(right)}</option>`).join('')}</select>`).join('')}</div>`}
 if(q.t==='code'){html+=`<label for="numericAnswer" class="muted small">Enter the numerical access code (no units):</label><div style="margin-top:10px"><input id="numericAnswer" class="answerfield" inputmode="numeric" type="text" pattern="[0-9]+" maxlength="7" autocomplete="off" placeholder="Enter code"></div>`}
 html+=`<div class="actions"><button class="btn btn-primary" data-action="check" id="checkBtn">Check answer</button><button class="btn" data-action="hint">Show hint</button><button class="btn btn-ghost" data-action="home">Save & exit to home</button></div><div id="feedbackSlot" aria-live="polite"></div></section>${renderRoomMap()}`;return html}
function doorScreen(){const i=state.room,r=R[i];return `<section class="panel"><div class="eyebrow">Security override complete</div><div class="certificate"><div class="seal">${i===4?'🏁':'🔓'}</div><h1>${i===4?'Final Exit Unlocked!':`Door ${i+1} Unlocked!`}</h1><p>You successfully cleared all eight ${escapeHTML(r.name)} challenges.</p><p class="score">Current points: ${state.correct*10} / 400</p></div><p class="muted" style="margin-top:18px">${i<4?'Your next destination is '+escapeHTML(R[i+1].name)+'.':'You have completed the hospital escape mission.'}</p><div class="actions"><button class="btn btn-primary" data-action="nextdoor">${i===4?'View final mission report':'Enter next room →'}</button><button class="btn" data-action="home">Back to home</button></div></section>${renderRoomMap()}`}
function finishScreen(){return `<section class="panel"><div class="certificate"><div class="seal">🏆</div><div class="eyebrow">Hospital systems restored</div><h1>Mission Complete!</h1><p>You escaped the hospital and completed all <strong>40 Anatomy & Physiology questions</strong>.</p><h2 style="font-size:2.6rem;color:var(--teal)">${state.correct*10} / 400</h2><p>First-attempt accuracy: ${Math.round(state.correct/40*100)}% · Rooms cleared: 5/5</p></div><p class="muted" style="margin-top:18px">Score is based on answers correct on the first check; you can still complete every challenge after a retry. Use review to revisit all explanations.</p><div class="actions"><button class="btn btn-primary" data-action="review">Review all 40 answers</button><button class="btn" data-action="home">Return home</button><button class="btn btn-danger" data-action="reset">Play again from scratch</button></div></section>`}
function reviewScreen(){let k=0;return `<section class="panel"><div class="eyebrow">Complete question bank</div><h1>Answer explanations · 40 questions</h1><p class="muted">Use this section for learning and academic review after completing the escape room.</p><div class="actions"><button class="btn" data-action="finish">← Back to results</button><button class="btn btn-ghost" onclick="window.print()">Print question bank</button></div><div class="summarylist">${R.map((r,i)=>`<h2 style="margin-top:20px">${r.icon} Room ${i+1}: ${escapeHTML(r.name)}</h2>${r.questions.map(q=>{k++;return `<article class="summaryitem"><b>Q${k} · ${typeLabel(q.t)}</b><p>${escapeHTML(q.q)}</p><details><summary>Show correct answer and explanation</summary><p><strong>Answer:</strong> ${escapeHTML(answerText(q))}</p><p>${escapeHTML(q.e)}</p></details></article>`}).join('')}`).join('')}</div></section>`}
function answerText(q){if(q.t==='mcq')return q.o[q.a];if(q.t==='tf')return q.a?'True':'False';if(q.t==='code')return q.a;return q.left.map((t,i)=>t+' → '+q.right[q.a[i]]).join('; ')}
function feedback(kind,title,text){$('feedbackSlot').innerHTML=`<div class="feedback ${kind}" role="status"><strong>${escapeHTML(title)}</strong><p>${escapeHTML(text)}</p></div>`}
function check(){const r=R[state.room],q=r.questions[state.steps[state.room]];let ok=false,valid=true;if(q.t==='mcq'||q.t==='tf'){const s=document.querySelector('input[name=ans]:checked');if(!s)valid=false;else ok=q.t==='tf'?(Number(s.value)===(q.a?0:1)):(Number(s.value)===q.a)}else if(q.t==='match'){const picks=[...document.querySelectorAll('[data-match]')].map(s=>s.value);valid=picks.every(v=>v!=='');ok=valid&&picks.every((v,i)=>Number(v)===q.a[i]);if(valid&&new Set(picks).size!==picks.length){feedback('bad','Use each function once.','Please select a different function for each term.');return}}else{const v=$('numericAnswer').value.trim();valid=/^\d+$/.test(v);ok=valid&&String(Number(v))===q.a}if(!valid){feedback('bad','Select or enter an answer.','Complete the question before submitting.');return}state.attempts++;if(ok){const earned=hadWrong?0:10;if(earned)state.correct++;state.steps[state.room]++;if(state.steps[state.room]===8)state.done[state.room]=true;save();feedback('good','✓ Access confirmed. +'+earned+' points',q.e);let slot=$('feedbackSlot');slot.insertAdjacentHTML('beforeend',`<div class="actions"><button class="btn btn-primary" data-action="continue">${state.steps[state.room]===8?'Unlock security door →':'Next challenge →'}</button></div>`);$('checkBtn').disabled=true;document.querySelectorAll('input[name=ans],select[data-match],#numericAnswer').forEach(e=>e.disabled=true);const b=slot.querySelector('[data-action="continue"]');b.addEventListener('click',()=>{hadWrong=false;mode=state.steps[state.room]===8?'door':'question';render();scrollMain()});}else{hadWrong=true;save();feedback('bad','Not quite — try again.',(q.hint?'Hint: '+q.hint+' ':'')+'Review the underlying physiology and submit another answer. You will still be able to unlock this room.');}}
function wire(){document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>action(b.dataset.action)));document.querySelectorAll('[data-room]').forEach(b=>b.addEventListener('click',()=>{const i=Number(b.dataset.room);if(!visitedRoom(i))return;state.room=i;hadWrong=false;mode=state.done[i]?'door':'question';state.started=true;save();render();scrollMain()}));}
function action(a){if(a==='home')mode='home';if(a==='rules')mode='rules';if(a==='start'){hadWrong=false;state.started=true;mode=state.finished?'finish':state.done[state.room]?'door':'question';save()}if(a==='hint'){const q=R[state.room].questions[state.steps[state.room]];feedback('','Study hint',q.hint||'Review the structure, function, or mechanism described in the question. You can retry without a time limit.');return}if(a==='check'){check();return}if(a==='nextdoor'){if(state.room===4){state.finished=true;mode='finish'}else{state.room++;hadWrong=false;mode='question'}save()}if(a==='review')mode='review';if(a==='finish')mode='finish';if(a==='reset'){if(!confirm('Reset all progress and first-attempt scores in this browser?'))return;state=defaultState();save();mode='home'}render();scrollMain()}
$('homeBtn').addEventListener('click',()=>action('home'));$('rulesBtn').addEventListener('click',()=>action('rules'));$('resetBtn').addEventListener('click',()=>action('reset'));
render();
</script></body></html>
